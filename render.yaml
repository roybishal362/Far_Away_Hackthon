# Deploy the Kakehashi FastAPI backend on Render (free tier).
# In the Render dashboard, set the secret env vars (GROQ_API_KEY, JSEARCH_API_KEY, ESTAT_APP_ID).
services:
  - type: web
    name: kakehashi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false      # set in dashboard (secret)
      - key: JSEARCH_API_KEY
        sync: false
      - key: ESTAT_APP_ID
        sync: false
